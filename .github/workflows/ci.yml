name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # The cross-repo standard full check (spec + rubocop + sig), exactly as a
  # contributor runs it locally — this is also what puts rubocop in CI. The
  # spec run duplicates one cell of the matrix above; that's the price of
  # running `check` unmodified.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake check
      - name: Fail if sig/tuile.rbs is out of date
        run: git diff --exit-code sig/
